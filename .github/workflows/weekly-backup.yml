name: Weekly Cloudflare D1 Snapshot Backup to R2

on:
  schedule:
    # 02:00 Sunday Asia/Ho_Chi_Minh = 19:00 Saturday UTC
    - cron: '0 19 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render API & create D1 backup snapshot on R2
        env:
          API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || vars.VITE_API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing VITE_API_BASE_URL or CRON_SECRET"
            exit 1
          fi
          API_BASE_URL="${API_BASE_URL%/}"
          curl --silent --show-error --retry 4 --retry-all-errors --retry-delay 15 --max-time 60 \
            "$API_BASE_URL/api/health" > /dev/null
          curl --fail-with-body --retry 2 --retry-delay 5 --max-time 120 \
            --request POST \
            --header "X-Cron-Secret: $CRON_SECRET" \
            "$API_BASE_URL/api/cron/backup-db"
